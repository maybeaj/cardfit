<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">CardFit 상세 Use Case Diagram</title>
  <desc id="desc">사용자, 데이터 공급자, 카드사 공식 채널과 CardFit의 상세 기능 관계</desc>
  <defs>
    <style>
      .label { font-family:Arial, "Noto Sans KR", sans-serif; fill:#17324d; font-size:17px; }
      .small { font-family:Arial, "Noto Sans KR", sans-serif; fill:#687b8d; font-size:13px; }
      .title { font-family:Arial, "Noto Sans KR", sans-serif; fill:#17324d; font-size:26px; font-weight:700; }
      .package-title { font-family:Arial, "Noto Sans KR", sans-serif; fill:#1769aa; font-size:15px; font-weight:700; }
      .system { fill:#f8fbfd; stroke:#91afc0; stroke-width:2; }
      .package { fill:#f1f7fa; stroke:#b8ccd7; stroke-width:1.5; stroke-dasharray:5 4; }
      .uc { fill:#fff; stroke:#1769aa; stroke-width:2; }
      .actor-line { fill:none; stroke:#17324d; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .assoc { stroke:#6f8797; stroke-width:1.7; fill:none; }
      .dashed { stroke:#6f8797; stroke-width:1.5; stroke-dasharray:7 5; fill:none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6f8797"/></marker>
  </defs>
  <rect width="1500" height="980" fill="#fff"/>
  <text x="750" y="38" text-anchor="middle" class="title">CardFit 상세 Use Case Diagram</text>
  <rect x="280" y="75" width="940" height="820" rx="14" class="system"/>
  <text x="305" y="108" class="title" font-size="22">CardFit 시스템</text>
  <rect x="305" y="130" width="425" height="340" rx="10" class="package"/>
  <text x="325" y="157" class="package-title">입력·진단</text>
  <rect x="755" y="130" width="440" height="340" rx="10" class="package"/>
  <text x="775" y="157" class="package-title">계산·검증</text>
  <rect x="305" y="500" width="890" height="365" rx="10" class="package"/>
  <text x="325" y="527" class="package-title">결과·확정·실행</text>

  <!-- actors -->
  <g transform="translate(125 385)">
    <circle cx="0" cy="0" r="25" class="actor-line" fill="#fff"/>
    <path d="M0 25 L0 105 M0 48 L-48 82 M0 48 L48 82 M0 105 L-38 165 M0 105 L38 165" class="actor-line"/>
    <text x="0" y="198" text-anchor="middle" class="label" font-weight="700">사용자</text>
  </g>
  <g transform="translate(750 920)">
    <circle cx="0" cy="0" r="22" class="actor-line" fill="#fff"/>
    <path d="M0 22 L0 88 M0 44 L-42 72 M0 44 L42 72 M0 88 L-32 140 M0 88 L32 140" class="actor-line"/>
    <text x="0" y="170" text-anchor="middle" class="label" font-weight="700">데이터 공급자</text>
    <text x="0" y="190" text-anchor="middle" class="small">Mock Fixture / 마이데이터</text>
  </g>
  <g transform="translate(1375 390)">
    <circle cx="0" cy="0" r="25" class="actor-line" fill="#fff"/>
    <path d="M0 25 L0 105 M0 48 L-48 82 M0 48 L48 82 M0 105 L-38 165 M0 105 L38 165" class="actor-line"/>
    <text x="0" y="198" text-anchor="middle" class="label" font-weight="700">카드사 공식 채널</text>
  </g>

  <!-- input and diagnosis use cases -->
  <g>
    <ellipse cx="435" cy="205" rx="105" ry="32" class="uc"/><text x="435" y="211" text-anchor="middle" class="label">데이터 연결</text>
    <ellipse cx="650" cy="205" rx="105" ry="32" class="uc"/><text x="650" y="211" text-anchor="middle" class="label">현재 카드 진단 확인</text>
    <ellipse cx="435" cy="315" rx="105" ry="32" class="uc"/><text x="435" y="309" text-anchor="middle" class="label">미래 지출 제안 조회</text><text x="435" y="327" text-anchor="middle" class="small">최근 12개월 패턴 기반</text>
    <ellipse cx="650" cy="315" rx="105" ry="32" class="uc"/><text x="650" y="321" text-anchor="middle" class="label">지출 계획 입력·수정</text>
    <ellipse cx="540" cy="420" rx="105" ry="32" class="uc"/><text x="540" y="426" text-anchor="middle" class="label">지출 계획 확정</text>
  </g>

  <!-- calculation and validation use cases -->
  <g>
    <ellipse cx="880" cy="205" rx="105" ry="32" class="uc"/><text x="880" y="211" text-anchor="middle" class="label">후보 조합 생성</text>
    <ellipse cx="1080" cy="205" rx="95" ry="32" class="uc"/><text x="1080" y="211" text-anchor="middle" class="label">혜택·비용 계산</text>
    <ellipse cx="880" cy="315" rx="105" ry="32" class="uc"/><text x="880" y="309" text-anchor="middle" class="label">Net Benefit 게이트</text><text x="880" y="327" text-anchor="middle" class="small">50,000원 AND 15%</text>
    <ellipse cx="1080" cy="315" rx="95" ry="32" class="uc"/><text x="1080" y="321" text-anchor="middle" class="label">배분액 계산</text>
    <ellipse cx="980" cy="420" rx="105" ry="32" class="uc"/><text x="980" y="426" text-anchor="middle" class="label">근거 6개 검증</text>
  </g>

  <!-- result and execution use cases -->
  <g>
    <ellipse cx="445" cy="590" rx="105" ry="32" class="uc"/><text x="445" y="596" text-anchor="middle" class="label">결과 상태 확인</text>
    <ellipse cx="680" cy="590" rx="105" ry="32" class="uc"/><text x="680" y="596" text-anchor="middle" class="label">계산 근거 확인</text>
    <ellipse cx="915" cy="590" rx="105" ry="32" class="uc"/><text x="915" y="596" text-anchor="middle" class="label">근거 누락 복구</text>
    <ellipse cx="1135" cy="590" rx="55" ry="32" class="uc"/><text x="1135" y="596" text-anchor="middle" class="label">재검증</text>
    <ellipse cx="560" cy="725" rx="105" ry="32" class="uc"/><text x="560" y="731" text-anchor="middle" class="label">조합 확정</text>
    <ellipse cx="790" cy="725" rx="105" ry="32" class="uc"/><text x="790" y="731" text-anchor="middle" class="label">다음 행동 확인</text>
    <ellipse cx="1020" cy="725" rx="105" ry="32" class="uc"/><text x="1020" y="719" text-anchor="middle" class="label">신규 카드 신청</text><text x="1020" y="737" text-anchor="middle" class="small">공식 채널 이동</text>
    <ellipse cx="790" cy="825" rx="105" ry="32" class="uc"/><text x="790" y="831" text-anchor="middle" class="label">입력 복원·재수정</text>
  </g>

  <!-- actor associations -->
  <path d="M150 385 L330 220 M150 400 L540 315 M150 420 L435 590 M150 440 L680 590 M150 460 L915 590 M150 480 L560 725 M150 500 L790 725 M150 520 L790 825" class="assoc"/>
  <path d="M750 900 L435 235 M750 900 L435 345 M750 900 L1080 345" class="assoc"/>
  <path d="M1350 390 L1135 725" class="assoc"/>

  <!-- include and extend relationships -->
  <path d="M540 388 L435 347" class="dashed" marker-end="url(#arrow)"/>
  <text x="475" y="374" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M645 420 L880 235" class="dashed" marker-end="url(#arrow)"/>
  <text x="760" y="331" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M985 235 L980 388" class="dashed" marker-end="url(#arrow)"/>
  <text x="1020" y="315" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M980 452 L915 558" class="dashed" marker-end="url(#arrow)"/>
  <text x="930" y="515" text-anchor="middle" class="small">&lt;&lt;extend&gt;&gt;</text>
  <path d="M1020 622 L1135 558" class="dashed" marker-end="url(#arrow)"/>
  <text x="1090" y="575" text-anchor="middle" class="small">&lt;&lt;include&gt;&gt;</text>
  <path d="M790 758 L790 792" class="dashed" marker-end="url(#arrow)"/>
  <text x="840" y="780" text-anchor="middle" class="small">&lt;&lt;extend&gt;&gt;</text>

  <text x="750" y="965" text-anchor="middle" class="small">실선: Actor와 기능의 상호작용 · 점선: 기능 간 include / extend 관계</text>
</svg>
